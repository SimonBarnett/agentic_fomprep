name: Launcher release

on:
  push:
    branches:
      - main
    tags:
      - "launcher-v*"
    paths:
      - "launcher/**"
      - "launcher.Tests/**"
      - ".github/workflows/launcher-release.yml"
  pull_request:
    paths:
      - "launcher/**"
      - "launcher.Tests/**"
      - ".github/workflows/launcher-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag (defaults to launcher-v1.0.<run number>)
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows executable
        run: dotnet publish launcher/PriorityAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o launcher/out
      - name: Run launcher acceptance tests
        run: dotnet run --project launcher.Tests/PriorityAgent.Tests.csproj -c Release
      - name: Check executable help
        shell: pwsh
        run: |
          $help = & .\launcher\out\PriorityAgent.exe --help | Out-String
          foreach ($option in @('--airc', '--no-airc', '--airc-console')) {
            if ($help -notmatch [regex]::Escape($option)) { throw "Help does not list $option" }
          }
      - name: Upload executable for release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/launcher-v')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: priority-agent-exe
          path: launcher/out/PriorityAgent.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/launcher-v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: priority-agent-exe
          path: launcher/out
      - name: Create checksum
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/launcher-v')
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\launcher\out\PriorityAgent.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\launcher\out\PriorityAgent.exe.sha256 -Value "$hash  PriorityAgent.exe" -NoNewline
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/launcher-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } else {
            $tag = "launcher-v1.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($tag -notmatch '^launcher-v') { throw "Release tag must begin with launcher-v" }
          $existing = gh release view $tag --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existing | ConvertFrom-Json).isPrerelease)) { throw "Refusing to overwrite a non-prerelease release" }
            gh release upload $tag .\launcher\out\PriorityAgent.exe .\launcher\out\PriorityAgent.exe.sha256 --clobber
          } else {
            gh release create $tag .\launcher\out\PriorityAgent.exe .\launcher\out\PriorityAgent.exe.sha256 `
              --title $tag --notes "Priority Agent launcher pre-release. Verify PriorityAgent.exe.sha256 before use." `
              --prerelease --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed" }
          $release = gh release view $tag --json isPrerelease,assets | ConvertFrom-Json
          if (-not $release.isPrerelease) { throw "Release is not marked as a pre-release" }
          $names = @($release.assets | ForEach-Object name)
          foreach ($asset in @('PriorityAgent.exe', 'PriorityAgent.exe.sha256')) {
            if ($asset -notin $names) { throw "Release asset is missing: $asset" }
          }
