version: 1
applications:
  - appRoot: v2/apps/mcp-catalog
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --include=dev --prefer-offline --no-audit --fund=false || npm install --include=dev --no-audit --fund=false
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
